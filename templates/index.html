      '晴朗': '☀', '大致晴朗': '◒', '局部多雲': '◐', '陰天': '☁', '有霧': '≋', '霧凇': '≋',
      '毛毛雨': '⋰', '小雨': '☂', '中雨': '☂', '大雨': '☂', '陣雨': '☂', '強陣雨': '☂',
      '小雪': '❄', '中雪': '❄', '大雪': '❄', '雷雨': 'ϟ', '雷雨伴隨冰雹': 'ϟ'
    };

    function t(key) {
      return translations[currentLanguage]?.[key] || translations.en[key] || key;
    }

    const detailTranslations = {
      'zh-TW': { today: '今天', feelsLike: '體感', humidity: '濕度', wind: '風速', details: '詳細資料', windType: '風的種類', windDirection: '風向', gusts: '陣風', average: '氣溫平均值', visibility: '能見度', pressure: '氣壓', uv: '紫外線指數', sunset: '日落時間', moonlight: '月亮照度', moonset: '月落時間', nextFullMoon: '下次滿月', forecast: '五日預報', refresh: '重新整理' },
      en: { today: 'Today', feelsLike: 'Feels like', humidity: 'Humidity', wind: 'Wind', details: 'Details', windType: 'Wind type', windDirection: 'Wind direction', gusts: 'Gusts', average: 'Average temperature', visibility: 'Visibility', pressure: 'Pressure', uv: 'UV index', sunset: 'Sunset', moonlight: 'Moon illumination', moonset: 'Moonset', nextFullMoon: 'Next full moon', forecast: 'Five-day forecast', refresh: 'Refresh' },
      'zh-CN': { today: '今天', feelsLike: '体感', humidity: '湿度', wind: '风速', details: '详细资料', windType: '风的种类', windDirection: '风向', gusts: '阵风', average: '平均气温', visibility: '能见度', pressure: '气压', uv: '紫外线指数', sunset: '日落时间', moonlight: '月亮照度', moonset: '月落时间', nextFullMoon: '下次满月', forecast: '五日预报', refresh: '刷新' }
    };

    function detailText(key) {
      return detailTranslations[currentLanguage]?.[key] || detailTranslations.en[key] || key;
    }

    function weatherText(value) {
      return translations[currentLanguage]?.weather?.[value] || value;
    }

    function applyLanguage(language) {
      currentLanguage = translations[language] ? language : 'en';
      document.documentElement.lang = currentLanguage;
      document.documentElement.dir = currentLanguage === 'ar' ? 'rtl' : 'ltr';
      languageSelect.value = currentLanguage;
      document.querySelector('.theme-label').textContent = t('theme');
      document.querySelector('.theme-hint').textContent = t('hint');
      document.querySelector('.unit-panel > span').textContent = t('unit');
      document.querySelector('.language-picker > span').textContent = t('language');
      document.querySelector('h1').textContent = t('title');
      document.querySelector('.intro').textContent = t('intro');
      document.querySelector('label[for="city"]').textContent = t('city');
      input.placeholder = t('placeholder');
      document.querySelector('#clear-search').setAttribute('aria-label', t('city'));
      document.querySelector('#clear-search').title = t('city');
      searchButton.textContent = t('search');
      document.querySelector('.hero > .section-heading h2').textContent = t('popular');
      document.querySelector('.hero > .section-heading span').textContent = t('quick');
      document.querySelector('#recent-cities h2').textContent = t('recent');
      document.querySelector('#clear-recent').textContent = t('clearHistory');
      document.querySelector('.world-cities summary span').textContent = t('world');
      document.querySelector('.world-cities summary small').textContent = t('more');
      document.querySelector('#henan-title').textContent = t('henan');
      document.querySelector('.henan-panel .section-heading span').textContent = t('count');
      document.querySelector('.section-note').textContent = t('henanNote');
      document.querySelector('label[for="henan-city"] span').textContent = t('choose');
      document.querySelector('#henan-city option').textContent = t('chooseHenan');
      document.querySelector('label[for="henan-filter"] span').textContent = t('filter');
      document.querySelector('#henan-filter').placeholder = t('filterPlaceholder');
      document.querySelector('#henan-empty').textContent = t('noMatch');
      if (!card.classList.contains('hidden')) {
        const city = input.value.trim();
        if (city) search(city);
      } else {
        status.textContent = t('initial');
      }
      applyTemperatureUnit();
      applyTheme(document.body.dataset.theme || 'morning');
      localStorage.setItem('weatherLanguage', currentLanguage);
    }

    function applyTheme(theme, animate = false) {
      if (animate) {
        document.body.classList.remove('theme-switching');
        requestAnimationFrame(() => document.body.classList.add('theme-switching'));
        window.setTimeout(() => document.body.classList.remove('theme-switching'), 520);
      }
      document.body.dataset.theme = theme;
      document.body.classList.toggle('dark-mode', theme === 'night');
      themeToggleIcon.textContent = theme === 'night' ? '☾' : '☼';
      themeToggleLabel.textContent = theme === 'night' ? t('light') : t('dark');
      themeToggle.setAttribute('aria-label', theme === 'night' ? t('light') : t('dark'));
      document.querySelectorAll('.theme-option').forEach(option => {
        option.classList.toggle('active', option.dataset.theme === theme);
      });
    }

    languageSelect.addEventListener('change', event => applyLanguage(event.target.value));
    applyLanguage(currentLanguage);
    const savedTheme = localStorage.getItem('weatherTheme') || 'morning';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
      const nextTheme = document.body.dataset.theme === 'night' ? 'morning' : 'night';
      localStorage.setItem('weatherTheme', nextTheme);
      applyTheme(nextTheme, true);
    });
    document.querySelectorAll('.theme-option').forEach(option => {
      option.addEventListener('click', () => {
        localStorage.setItem('weatherTheme', option.dataset.theme);
        applyTheme(option.dataset.theme);
      });
    });

    function formatTemperature(value) {
      const celsius = Number(value);
      if (!Number.isFinite(celsius)) return '--';
      if (temperatureUnit === 'F') return `${Math.round((celsius * 9 / 5 + 32) * 10) / 10}°F`;
      return `${celsius}°C`;
    }

    function formatValue(value, suffix = '') {
      return value === null || value === undefined || value === '' ? '--' : `${value}${suffix}`;
    }

    function formatTime(value) {
      return value ? value.slice(11, 16) : '--';
    }

    function applyTemperatureUnit() {
      unitToggle.textContent = temperatureUnit === 'F' ? '°F' : '°C';
      unitToggle.setAttribute('aria-label', `${t('unit')} ${temperatureUnit === 'F' ? '°C' : '°F'}`);
    }

    applyTemperatureUnit();
    unitToggle.addEventListener('click', () => {
      temperatureUnit = temperatureUnit === 'C' ? 'F' : 'C';
      localStorage.setItem('temperatureUnit', temperatureUnit);
      applyTemperatureUnit();
      if (!card.classList.contains('hidden')) {
        const city = input.value.trim();
        if (city) search(city);
      }
    });

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      })[character]);
    }

    function renderWeather(data) {
      const current = data.current;
      const today = data.daily[0] || {};
      const astronomy = data.astronomy || {};
      const currentDescription = weatherText(current.description);
      const image = data.location.image_url
        ? `<img class="city-image" src="${escapeHtml(data.location.image_url)}" alt="${escapeHtml(data.location.name)}" loading="lazy">`
        : '<div class="city-image image-fallback" aria-hidden="true">CITY<br>VIEW</div>';
      const forecast = data.daily.map((day, index) => `
        <li><span>${index === 0 ? detailText('today') : escapeHtml(day.date.slice(5))}</span><i>${weatherIcons[day.description] || '·'}</i><strong>${escapeHtml(weatherText(day.description))}</strong><b>${formatTemperature(day.max)} / ${formatTemperature(day.min)}</b></li>
      `).join('');
      card.innerHTML = `
        ${image}
        <div class="place"><div><p class="eyebrow">CURRENT CONDITIONS</p><h2>${escapeHtml(data.location.name)}</h2><p>${escapeHtml(data.location.admin1 || '')} ${escapeHtml(data.location.country)}</p></div><div class="weather-icon" aria-hidden="true">${weatherIcons[current.description] || '·'}</div><div class="temperature">${formatTemperature(current.temperature)}</div></div>
        <div class="condition-row"><p class="condition">${escapeHtml(currentDescription)}</p><span class="updated">${t('updated')}${new Date().toLocaleTimeString(currentLanguage, { hour: '2-digit', minute: '2-digit' })}</span></div>
        <div class="details"><span>${detailText('feelsLike')} <b>${formatTemperature(current.apparent_temperature)}</b></span><span>${detailText('humidity')} <b>${escapeHtml(current.humidity)}%</b></span><span>${detailText('wind')} <b>${escapeHtml(current.wind_speed)} ${escapeHtml(current.wind_unit)}</b></span></div>
        <h3>${detailText('details')}</h3>
        <div class="detail-grid">
          <div><span>${detailText('windType')}</span><b>${escapeHtml(current.wind_type)}</b></div><div><span>${detailText('windDirection')}</span><b>${escapeHtml(current.wind_direction_text)} ${escapeHtml(current.wind_direction)}°</b></div><div><span>${detailText('gusts')}</span><b>${formatValue(current.wind_gusts, ` ${current.wind_gusts_unit}`)}</b></div><div><span>${detailText('average')}</span><b>${formatTemperature(today.mean)}</b></div><div><span>${detailText('visibility')}</span><b>${Number.isFinite(Number(current.visibility)) ? `${(Number(current.visibility) / 1000).toFixed(1)} km` : '--'}</b></div><div><span>${detailText('pressure')}</span><b>${formatValue(current.pressure, ` ${current.pressure_unit}`)}</b></div><div><span>${detailText('uv')}</span><b>${formatValue(today.uv_index)}</b></div><div><span>${detailText('sunset')}</span><b>${formatTime(today.sunset)}</b></div><div><span>${detailText('moonlight')}</span><b>${formatValue(astronomy.illumination, '%')}</b></div><div><span>${detailText('moonset')}</span><b>${escapeHtml(astronomy.moonset || '--')}</b></div>
          <div class="wide-detail"><span>${detailText('nextFullMoon')}</span><b>${escapeHtml(astronomy.next_full_moon || '--')}</b></div>
        </div>
        <h3>${detailText('forecast')}</h3><ul class="forecast">${forecast}</ul>
        <footer class="card-footer"><span>Open-Meteo · ${escapeHtml(data.location.timezone || '')}</span><button type="button" class="refresh-button" data-refresh-city="${escapeHtml(input.value.trim())}">↻ ${detailText('refresh')}</button></footer>
      `;
      card.classList.remove('hidden');
      card.querySelector('.refresh-button').addEventListener('click', () => search(input.value.trim(), true));
      loadCityImage(data.location.name);
    }

    async function loadCityImage(city) {
      const imageController = new AbortController();
      const imageTimeout = setTimeout(() => imageController.abort(), 8000);
      try {
        const response = await fetch(`/api/city-image?city=${encodeURIComponent(city)}`, { signal: imageController.signal });
        if (!response.ok) return;
        const result = await response.json();
        if (result.image_url && input.value.trim() === city) {
          const image = document.createElement('img');
          image.className = 'city-image';
          image.alt = `${city} 城市圖片`;
          image.loading = 'lazy';
          image.referrerPolicy = 'no-referrer';
          image.src = result.image_url;
          const fallback = card.querySelector('.city-image');
          image.addEventListener('error', () => {
            image.className = 'city-image image-fallback';
            image.innerHTML = 'CITY<br>VIEW';
            image.removeAttribute('src');
          }, { once: true });
          if (fallback) fallback.replaceWith(image);
        }
      } catch (error) {
        // 天氣結果已經顯示，圖片失敗時保留備援視覺。
      } finally {
        clearTimeout(imageTimeout);
      }
    }

    function renderRecentCities() {
      let cities = [];
      try {
        const stored = JSON.parse(localStorage.getItem('weatherRecentCities') || '[]');
        cities = Array.isArray(stored) ? stored.filter(city => typeof city === 'string') : [];
      } catch (error) {
        localStorage.removeItem('weatherRecentCities');
      }
      recentList.innerHTML = '';
      recentCities.classList.toggle('hidden', cities.length === 0);
      cities.forEach(city => {
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = city;
        button.addEventListener('click', () => { input.value = city; search(city); });
        recentList.appendChild(button);
      });
    }

    function saveRecentCity(city) {
      let cities = [];
      try {
        const stored = JSON.parse(localStorage.getItem('weatherRecentCities') || '[]');
        cities = Array.isArray(stored) ? stored.filter(item => typeof item === 'string') : [];
      } catch (error) {
        localStorage.removeItem('weatherRecentCities');
      }
      const updated = [city, ...cities.filter(item => item !== city)].slice(0, 5);
      localStorage.setItem('weatherRecentCities', JSON.stringify(updated));
      renderRecentCities();
    }

    function saveWeatherSnapshot(city, data) {
      try {
        const snapshots = JSON.parse(localStorage.getItem('weatherSnapshots') || '{}');
        snapshots[city.toLowerCase()] = data;
        localStorage.setItem('weatherSnapshots', JSON.stringify(snapshots));
      } catch (error) {
        localStorage.removeItem('weatherSnapshots');
      }
    }

    function getWeatherSnapshot(city) {
      try {
        const snapshots = JSON.parse(localStorage.getItem('weatherSnapshots') || '{}');
        return snapshots[city.toLowerCase()] || null;
      } catch (error) {
        return null;
      }
    }

    async function search(city, forceRefresh = false) {
      if (activeRequest) activeRequest.abort();
      const controller = new AbortController();
      let timedOut = false;
      const requestTimeout = setTimeout(() => {
        timedOut = true;
        controller.abort();
      }, 15000);
      activeRequest = controller;
      const hadWeatherCard = !card.classList.contains('hidden');
      status.textContent = t('loading');
      status.classList.add('loading');
      status.setAttribute('aria-busy', 'true');
      searchButton.disabled = true;
      searchButton.textContent = t('searching');
      try {
        const response = await fetch(`/api/weather?city=${encodeURIComponent(city)}${forceRefresh ? '&refresh=1' : ''}`, { signal: controller.signal });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '查詢失敗');
        renderWeather(data);
        saveWeatherSnapshot(city, data);
        saveRecentCity(city);
        status.textContent = `${t('updated')}${data.location.name}`;
      } catch (error) {
        if (error.name === 'AbortError' && !timedOut) return;
        if (timedOut) {
          status.textContent = '天氣服務回應逾時，請稍後再試。';
          return;
        }
        const snapshot = getWeatherSnapshot(city);
        if (snapshot) {
          renderWeather(snapshot);
          status.textContent = `${t('offline')} ${snapshot.location.name}`;
        } else {
          status.textContent = hadWeatherCard
            ? `${error.message}，已保留上一次結果。`
            : error.message;
        }
      } finally {
        clearTimeout(requestTimeout);
        if (activeRequest === controller) {
          activeRequest = null;
          status.classList.remove('loading');
          status.setAttribute('aria-busy', 'false');
          searchButton.disabled = false;
          searchButton.textContent = t('search');
        }
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      if (input.value.trim()) search(input.value.trim());
    });
    const clearSearch = document.querySelector('#clear-search');
    input.addEventListener('input', () => { clearSearch.classList.toggle('visible', input.value.length > 0); });
    clearSearch.addEventListener('click', () => {
      input.value = '';
      input.focus();
      clearSearch.classList.remove('visible');
      status.textContent = '輸入城市開始查詢';
      card.classList.add('hidden');
    });
    document.querySelector('#clear-recent').addEventListener('click', () => {
      localStorage.removeItem('weatherRecentCities');
      renderRecentCities();
    });
    renderRecentCities();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(() => {});
    }

    {
      let pendingPointer = null;
      let pointerFrame = null;
      const surfaces = '.theme-panel, .henan-panel, .weather-card, .search-bar';

      function lightSurface(event) {
        const surface = event.target.closest(surfaces);
        document.querySelectorAll('.pointer-lit').forEach(element => {
          if (element !== surface) element.classList.remove('pointer-lit');
        });
        if (!surface) return;
        const bounds = surface.getBoundingClientRect();
        surface.style.setProperty('--pointer-x', `${event.clientX - bounds.left}px`);
        surface.style.setProperty('--pointer-y', `${event.clientY - bounds.top}px`);
        surface.classList.add('pointer-lit');
      }

      document.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch') return;
        pendingPointer = event;
        if (pointerFrame) return;
        pointerFrame = requestAnimationFrame(() => {
          lightSurface(pendingPointer);
          pendingPointer = null;
          pointerFrame = null;
        });
      });
      document.addEventListener('pointerdown', event => {
        lightSurface(event);
        const surface = event.target.closest(surfaces);
        if (!surface) return;
        if (event.pointerType === 'touch') {
          clearTimeout(surface.touchGlowTimer);
          surface.touchGlowTimer = setTimeout(() => surface.classList.remove('pointer-lit'), 1200);
        }
      });
    }
    document.querySelectorAll('[data-city]').forEach(button => {
      button.addEventListener('click', () => { input.value = button.dataset.city; search(button.dataset.city); });
    });
    document.querySelector('#henan-city').addEventListener('change', event => {
      if (event.target.value) { input.value = event.target.value; search(event.target.value); }
    });
    document.querySelector('#henan-filter').addEventListener('input', event => {
      const keyword = event.target.value.trim().toLowerCase();
      const buttons = [...document.querySelectorAll('.henan-cities [data-city]')];
      buttons.forEach(button => {
        button.hidden = keyword && !button.dataset.city.toLowerCase().includes(keyword);
      });
      document.querySelector('#henan-empty').classList.toggle('hidden', buttons.some(button => !button.hidden));
    });
  </script>
</body>
</html>
